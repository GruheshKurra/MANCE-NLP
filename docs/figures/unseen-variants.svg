<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .title { font-size: 16px; font-weight: 600; fill: #1b2130; }
    .sub { font-size: 12.5px; fill: #52514e; }
    .w { font-size: 14px; fill: #1b2130; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
    .v { font-size: 14px; fill: #1b2130; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-weight: 600; }
    .arr { font-size: 14px; fill: #8a909c; }
    .stat { font-size: 13px; fill: #1b2130; font-weight: 600; }
    .note { font-size: 12.5px; fill: #52514e; }
  </style>
  <rect width="920" height="330" rx="12" fill="#ffffff"/>

  <text x="30" y="36" class="title">Unseen-variant test (AG News)</text>
  <text x="30" y="56" class="sub">Each picked test word is swapped for another form of the same stem that never appears in the training split. Labels stay the same.</text>

  <!-- Rule set -->
  <rect x="30" y="76" width="420" height="200" rx="10" fill="#f4f7fc" stroke="#2a78d6"/>
  <text x="50" y="104" class="title">Rule set</text>
  <text x="50" y="124" class="sub">any unseen inflection of the stem</text>
  <g transform="translate(50,150)">
    <text x="0" y="0" class="w">team</text><text x="110" y="0" class="arr">→</text><text x="140" y="0" class="v">teamest</text>
    <text x="0" y="24" class="w">short</text><text x="110" y="24" class="arr">→</text><text x="140" y="24" class="v">shorting</text>
    <text x="0" y="48" class="w">shift</text><text x="110" y="48" class="arr">→</text><text x="140" y="48" class="v">shiftly</text>
    <text x="0" y="72" class="w">proteins</text><text x="110" y="72" class="arr">→</text><text x="140" y="72" class="v">proteiner</text>
  </g>
  <text x="50" y="252" class="stat">34,201 of 342,009 test words replaced (10%)</text>
  <text x="50" y="268" class="note">Many results are not real English words.</text>

  <!-- Attested set -->
  <rect x="470" y="76" width="420" height="200" rx="10" fill="#fdf3ee" stroke="#eb6834"/>
  <text x="490" y="104" class="title">Attested set</text>
  <text x="490" y="124" class="sub">only forms that occur 20+ times, in lowercase, in DBpedia text</text>
  <g transform="translate(490,150)">
    <text x="0" y="0" class="w">educating</text><text x="110" y="0" class="arr">→</text><text x="140" y="0" class="v">educates</text>
    <text x="0" y="24" class="w">Letter</text><text x="110" y="24" class="arr">→</text><text x="140" y="24" class="v">Lettering</text>
    <text x="0" y="48" class="w">first</text><text x="110" y="48" class="arr">→</text><text x="140" y="48" class="v">firstly</text>
    <text x="0" y="72" class="w">service</text><text x="110" y="72" class="arr">→</text><text x="140" y="72" class="v">serviced</text>
  </g>
  <text x="490" y="252" class="stat">4,800 of 342,009 test words replaced (1.4%)</text>
  <text x="490" y="268" class="note">Real words, but few test words have an unseen real variant.</text>

  <text x="30" y="306" class="note">Score drop = accuracy on the original test set minus accuracy on the changed one. Same sampling seed for every model.</text>
</svg>
